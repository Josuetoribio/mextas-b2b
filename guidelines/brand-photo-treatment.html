<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--surface-page);color:var(--fg-2);font-family:var(--font-body);padding:20px 24px}.row{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;gap:6px;font:500 11px/1.3 var(--font-mono);color:var(--fg-3)}.sw i{display:block;height:64px;border-radius:10px;border:1px solid var(--border-subtle)}.sw b{color:var(--fg-1);font-weight:500}.h{position:relative;height:220px;border-radius:14px;overflow:hidden}.h img{width:100%;height:100%;object-fit:cover;object-position:62% 30%}.h::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,6,13,.97),rgba(3,6,13,.45) 58%,rgba(3,6,13,.15)),linear-gradient(0deg,var(--mx-black),transparent 35%)}.h div{position:absolute;z-index:1;left:28px;top:50%;transform:translateY(-50%);font:800 34px/1.05 var(--font-display);letter-spacing:-.03em;color:#fff}</style></head><body><div class="h"><img src="../assets/img/hero.jpg" alt=""><div>Copy sits on<br><span style="color:var(--mx-blue-500)">the dark side.</span></div></div></body></html>
