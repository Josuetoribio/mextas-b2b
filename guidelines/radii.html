<!-- @dsCard group="Spacing" viewport="700x150" name="Corner radii" subtitle="6 → 28px; pills for badges & icon buttons" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--surface-page);color:var(--fg-2);font-family:var(--font-body);padding:20px 24px}.row{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;gap:6px;font:500 11px/1.3 var(--font-mono);color:var(--fg-3)}.sw i{display:block;height:64px;border-radius:10px;border:1px solid var(--border-subtle)}.sw b{color:var(--fg-1);font-weight:500}</style></head><body><div class="row"><div class="sw"><i style="border-radius:var(--radius-xs);background:var(--surface-raised);border-color:var(--border-strong)"></i><b>xs</b></div><div class="sw"><i style="border-radius:var(--radius-sm);background:var(--surface-raised);border-color:var(--border-strong)"></i><b>sm</b></div><div class="sw"><i style="border-radius:var(--radius-md);background:var(--surface-raised);border-color:var(--border-strong)"></i><b>md</b></div><div class="sw"><i style="border-radius:var(--radius-lg);background:var(--surface-raised);border-color:var(--border-strong)"></i><b>lg</b></div><div class="sw"><i style="border-radius:var(--radius-xl);background:var(--surface-raised);border-color:var(--border-strong)"></i><b>xl</b></div><div class="sw"><i style="border-radius:var(--radius-2xl);background:var(--surface-raised);border-color:var(--border-strong)"></i><b>2xl</b></div><div class="sw"><i style="border-radius:var(--radius-pill);background:var(--surface-raised);border-color:var(--border-strong)"></i><b>pill</b></div></div></body></html>
