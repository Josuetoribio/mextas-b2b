<!-- @dsCard group="Spacing" viewport="700x180" name="Elevation & glow" subtitle="Dark drop shadows + faint blue glow for emphasis" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--surface-page);color:var(--fg-2);font-family:var(--font-body);padding:20px 24px}.row{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;gap:6px;font:500 11px/1.3 var(--font-mono);color:var(--fg-3)}.sw i{display:block;height:64px;border-radius:10px;border:1px solid var(--border-subtle)}.sw b{color:var(--fg-1);font-weight:500}</style></head><body><div class="row" style="gap:24px;padding:14px 4px"><div class="sw"><i style="height:90px;background:var(--surface-raised);box-shadow:var(--shadow-card);border-color:var(--border-default)"></i><b>card</b></div><div class="sw"><i style="height:90px;background:var(--surface-raised);box-shadow:var(--shadow-raised);border-color:var(--border-default)"></i><b>raised</b></div><div class="sw"><i style="height:90px;background:var(--surface-raised);box-shadow:var(--glow-blue);border-color:var(--border-default)"></i><b>glow-blue</b></div><div class="sw"><i style="height:90px;background:var(--surface-raised);box-shadow:var(--glow-soft);border-color:var(--border-default)"></i><b>glow-soft</b></div></div></body></html>
