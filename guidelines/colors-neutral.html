<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--surface-page);color:var(--fg-2);font-family:var(--font-body);padding:20px 24px}.row{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;gap:6px;font:500 11px/1.3 var(--font-mono);color:var(--fg-3)}.sw i{display:block;height:64px;border-radius:10px;border:1px solid var(--border-subtle)}.sw b{color:var(--fg-1);font-weight:500}</style></head><body><div class="row"><div class="sw"><i style="background:var(--fg-1)"></i><b>fg-1 headings</b>--fg-1</div><div class="sw"><i style="background:var(--fg-2)"></i><b>fg-2 body</b>--fg-2</div><div class="sw"><i style="background:var(--fg-3)"></i><b>fg-3 secondary</b>--fg-3</div><div class="sw"><i style="background:var(--fg-4)"></i><b>fg-4 meta</b>--fg-4</div><div class="sw"><i style="background:var(--mx-gray-500)"></i><b>Gray 500</b>--mx-gray-500</div><div class="sw"><i style="background:var(--mx-gray-600)"></i><b>Gray 600</b>--mx-gray-600</div></div></body></html>
