<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--surface-page);color:var(--fg-2);font-family:var(--font-body);padding:20px 24px}.row{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;gap:6px;font:500 11px/1.3 var(--font-mono);color:var(--fg-3)}.sw i{display:block;height:64px;border-radius:10px;border:1px solid var(--border-subtle)}.sw b{color:var(--fg-1);font-weight:500}</style></head><body><div class="row"><div class="sw"><i style="background:var(--state-success)"></i><b>Success</b>--state-success</div><div class="sw"><i style="background:var(--state-warning)"></i><b>Warning · Demo</b>--state-warning</div><div class="sw"><i style="background:var(--state-danger)"></i><b>Danger</b>--state-danger</div><div class="sw"><i style="background:var(--surface-accent-soft)"></i><b>Accent soft</b>--surface-accent-soft</div></div></body></html>
