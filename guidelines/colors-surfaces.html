<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--surface-page);color:var(--fg-2);font-family:var(--font-body);padding:20px 24px}.row{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;gap:6px;font:500 11px/1.3 var(--font-mono);color:var(--fg-3)}.sw i{display:block;height:64px;border-radius:10px;border:1px solid var(--border-subtle)}.sw b{color:var(--fg-1);font-weight:500}.s{flex:1;height:110px;border-radius:14px;padding:12px;font:500 11px/1.4 var(--font-mono);color:var(--fg-3);display:flex;flex-direction:column;justify-content:flex-end}.s b{color:var(--fg-1);font-weight:500}</style></head><body><div class="row" style="background:radial-gradient(circle at 70% 30%,#1a3b78,transparent 60%),var(--mx-black);padding:14px;border-radius:14px"><div class="s" style="background:var(--surface-card);border:1px solid var(--border-default);backdrop-filter:blur(14px)"><b>card</b>--surface-card<br>--border-default</div><div class="s" style="background:var(--surface-glass);border:1px solid var(--border-strong);backdrop-filter:blur(14px)"><b>glass</b>--surface-glass<br>--border-strong</div><div class="s" style="background:var(--surface-raised);border:1px solid var(--border-subtle);backdrop-filter:blur(14px)"><b>raised</b>--surface-raised<br>--border-subtle</div><div class="s" style="background:var(--surface-input);border:1px solid var(--border-default);backdrop-filter:blur(14px)"><b>input</b>--surface-input<br>--border-default</div><div class="s" style="background:var(--surface-accent-soft);border:1px solid var(--border-accent);backdrop-filter:blur(14px)"><b>selected</b>--surface-accent-soft<br>--border-accent</div></div></body></html>
