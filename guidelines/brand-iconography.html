<!-- @dsCard group="Brand" viewport="700x150" name="Iconography" subtitle="Lucide line icons, 1.75 stroke, in 40px tinted tiles" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--surface-page);color:var(--fg-2);font-family:var(--font-body);padding:20px 24px}.row{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;gap:6px;font:500 11px/1.3 var(--font-mono);color:var(--fg-3)}.sw i{display:block;height:64px;border-radius:10px;border:1px solid var(--border-subtle)}.sw b{color:var(--fg-1);font-weight:500}.t{display:grid;place-items:center;width:44px;height:44px;border-radius:10px;border:1px solid rgba(63,138,255,.4);background:rgba(47,123,255,.12);color:var(--mx-blue-300)}</style></head><body><div class="row" id="ic" style="gap:12px"></div><script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script><script>document.getElementById('ic').innerHTML=['monitor-smartphone','shopping-bag','layout-dashboard','workflow','chart-no-axes-combined','plug-zap','contact','chart-line','compass','rocket'].map(n=>'<span class="t"><i data-lucide="'+n+'"></i></span>').join('');lucide.createIcons({attrs:{'stroke-width':1.75,width:20,height:20}});</script></body></html>
