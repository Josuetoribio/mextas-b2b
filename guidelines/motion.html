<!-- @dsCard group="Spacing" viewport="700x160" name="Motion" subtitle="ease-out expo, fade-up + blur reveal, no bounce" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--surface-page);color:var(--fg-2);font-family:var(--font-body);padding:20px 24px}.row{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;gap:6px;font:500 11px/1.3 var(--font-mono);color:var(--fg-3)}.sw i{display:block;height:64px;border-radius:10px;border:1px solid var(--border-subtle)}.sw b{color:var(--fg-1);font-weight:500}@keyframes up{0%,20%{opacity:0;transform:translateY(22px);filter:blur(4px)}60%,100%{opacity:1;transform:none;filter:none}}.m{animation:up 2.6s var(--ease-out) infinite}</style></head><body><div class="row" style="gap:16px;align-items:center"><div class="mx-card m" style="padding:18px 22px;color:#fff;font-weight:600">Reveal</div><div class="m" style="animation-delay:.12s"><div class="mx-card" style="padding:18px 22px;color:#fff;font-weight:600">Stagger +70ms</div></div><div style="font:500 11px/1.6 var(--font-mono);color:var(--fg-3)">--ease-out cubic-bezier(.22,1,.36,1)<br>fast 160 · base 280 · slow 600 · reveal 900ms<br>prefers-reduced-motion → off</div></div></body></html>
